[package]
name = "turbojev-rust-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
turbojev = "=0.33.1"
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
libloading = "0.8"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
# System TLS avoids ring's C/assembly toolchain requirement for Windows ARM64.
ureq = { version = "2.12", default-features = false, features = ["native-tls", "gzip"] }
native-tls = "0.2"

[target.'cfg(not(windows))'.dependencies]
ureq = "2.12"

[workspace]
resolver = "2"
